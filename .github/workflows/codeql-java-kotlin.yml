name: CodeQL (Java/Kotlin)

# Production JVM extraction pass.
#
# CodeQL extracts Kotlin TRAP by intercepting K2JVMCompiler via javaagent.
# Compiling the real JVM target (`compileKotlinJvm`) feeds the production
# commonMain + jvmMain sources directly to the extractor without synthetic tasks
# or auxiliary Gradle subprojects. Non-Android CodeQL must not install the Android SDK.

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
          dependency-caching: true

      - name: Build Java/Kotlin extraction target
        run: |
          export JAVA_TOOL_OPTIONS="-javaagent:${CODEQL_EXTRACTOR_JAVA_ROOT}/tools/codeql-java-agent.jar=java,kotlin"
          echo "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS}"
          ./gradlew --no-daemon compileKotlinJvm --no-configuration-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:java-kotlin"
